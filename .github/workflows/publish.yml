name: Spring boot rest api deployment process

on:
  push:
    branches: [dev, main]

jobs:
  build-docker:
    name: Build and deploy spring project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven

      - name: Build with Maven
        run: mvn -f pom.xml clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push docker hub
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT }}:latest


  deploy:
    name: Deploy to DonWeb SpringApp
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: install ssh pass
        run: sudo apt-get install -y sshpass

      - name: SSH INTO DON WEB SERVER - DEPLOY
        run: |
          sshpass -p ${{ secrets.VPS_PASSWORD }} ssh -p 5003 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
          
            docker rm -f spring-apibot  
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT }}:latest
            docker run -d \
              --restart always \
              --name spring-apibot \
              -p9698:9698 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT }}:latest
          EOF